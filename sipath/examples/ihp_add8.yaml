# ihp_add8: an embedded soft macro on IHP SG13G2 (the second PDK).
#   python3 -m sipath run sipath/examples/ihp_add8.yaml [workdir]
# Same flow code as the Sky130 examples; everything PDK-specific (layers, PDN,
# cells, corners, RC) comes from sipath/pdks/ihp-sg13g2.yaml. No tap or endcap
# cells in this library. Embedded macro: routing and straps up to Metal4.
name: ihp_add8
top: ihp_add8
mode: macro
pdk: ihp-sg13g2
inputs:
  generate: sipath.examples.ihp_add8:write_inputs
netlist: inputs/ihp_add8.v
sdc: inputs/ihp_add8.sdc
floorplan_def: inputs/ihp_add8_floorplan.def
is_core: false
analog_nets: ['ana_in[0]', 'ana_in[1]']
datapaths:
- name: adder
  kind: slices
  cells:
  - [u_in.ra_0, u_in.rb_0, u_add.p_0, u_add.g_0, u_add.s_0, u_add.c_0]
  - [u_in.ra_1, u_in.rb_1, u_add.p_1, u_add.g_1, u_add.s_1, u_add.c_1]
  - [u_in.ra_2, u_in.rb_2, u_add.p_2, u_add.g_2, u_add.s_2, u_add.c_2]
  - [u_in.ra_3, u_in.rb_3, u_add.p_3, u_add.g_3, u_add.s_3, u_add.c_3]
  - [u_in.ra_4, u_in.rb_4, u_add.p_4, u_add.g_4, u_add.s_4, u_add.c_4]
  - [u_in.ra_5, u_in.rb_5, u_add.p_5, u_add.g_5, u_add.s_5, u_add.c_5]
  - [u_in.ra_6, u_in.rb_6, u_add.p_6, u_add.g_6, u_add.s_6, u_add.c_6]
  - [u_in.ra_7, u_in.rb_7, u_add.p_7, u_add.g_7, u_add.s_7, u_add.c_7]
  origin: [20.0, 20.0]
groups:
- name: out_cluster
  prefix: u_out.
  kind: cluster
  utilization: 0.8
flow:
- step: floorplan
- step: physical
- step: place
  variants:
  - density: 0.5
    seed: 1
  - density: 0.65
    seed: 2
  score: routability_then_wns
  parallel: 2
- step: cts
- step: route_analog
- step: route_digital
  score: drc_then_slack
- step: route_repair
- step: extract
