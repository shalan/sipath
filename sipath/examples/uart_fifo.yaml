# Fixed-divisor 8N1 UART, four-byte FIFOs and a small register interface.
name: uart_fifo
top: uart_fifo
mode: macro
pdk: sky130A
rtl: [rtl/uart_fifo.v]
sdc: rtl/uart_fifo.sdc
core_utilization: 0.35
core_margin: 6.0
is_core: false
flow:
- step: synth
- step: floorplan
- step: physical
- step: place
- step: cts
  variants: [{sink_clustering_size: 8, sink_clustering_levels: 2, distance_between_buffers: 20.0}]
- step: route_analog
- step: route_digital
- step: route_repair
- step: fill                 # metal fill (PDK fill rules); signoff checks density
- step: extract
- step: signoff
- step: views
