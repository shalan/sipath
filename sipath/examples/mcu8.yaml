# mcu8: an MCU die (mode 2) on Sky130 HD with ChipFoundry hard macros.
#   python3 -m sipath run sipath/examples/mcu8.yaml [workdir]
# Die box + 39 pads (edge, order) -> pad ring (geometry derived from the IO
# library); CF_SRAM_1024x32 frozen; EF_ADCS1008NC and rdac3v_8bit autoplaced by
# a sweep (seeded random search, the same with orientation search, and
# rtl_macro_placer) scored after a quick placement + global route, under
# channel / pin-side / analog-guard rules. Flat top: soft logic between the
# macros; datapath column + array, a fence and a cluster; core ring joined to
# the VCCD/VSSD pads; analog nets and VDDA/VSSA routed first with NDRs.
# Pad LEFs, corner and filler cells come from the PDK's IO library.
name: mcu8
top: mcu8
mode: die
pdk: sky130A
inputs:
  generate: sipath.examples.designs:write_mcu8
netlist: inputs/mcu8_flat.v
sdc: inputs/mcu8.sdc
die: [0.0, 0.0, 1500.0, 1500.0]
core_margin: 241.0
pads:
- inst: pad_clk
  edge: west
  order: 0
  master: sky130_ef_io__gpiov2_pad_wrapped
- inst: pad_rst_n
  edge: west
  order: 1
  master: sky130_ef_io__gpiov2_pad_wrapped
- inst: pad_en
  edge: west
  order: 2
  master: sky130_ef_io__gpiov2_pad_wrapped
- inst: pad_vccd_w
  edge: west
  order: 3
  master: sky130_ef_io__vccd_lvc_clamped_pad
- inst: pad_vssd_w
  edge: west
  order: 4
  master: sky130_ef_io__vssd_lvc_clamped_pad
- inst: pad_gain_0
  edge: west
  order: 5
  master: sky130_ef_io__gpiov2_pad_wrapped
- inst: pad_gain_1
  edge: west
  order: 6
  master: sky130_ef_io__gpiov2_pad_wrapped
- inst: pad_gain_2
  edge: west
  order: 7
  master: sky130_ef_io__gpiov2_pad_wrapped
- inst: pad_gain_3
  edge: west
  order: 8
  master: sky130_ef_io__gpiov2_pad_wrapped
- inst: pad_vddio_w
  edge: west
  order: 9
  master: sky130_ef_io__vddio_hvc_clamped_pad
- inst: pad_vssio_w
  edge: west
  order: 10
  master: sky130_ef_io__vssio_hvc_clamped_pad
- inst: pad_dout_0
  edge: north
  order: 0
  master: sky130_ef_io__gpiov2_pad_wrapped
- inst: pad_dout_1
  edge: north
  order: 1
  master: sky130_ef_io__gpiov2_pad_wrapped
- inst: pad_dout_2
  edge: north
  order: 2
  master: sky130_ef_io__gpiov2_pad_wrapped
- inst: pad_dout_3
  edge: north
  order: 3
  master: sky130_ef_io__gpiov2_pad_wrapped
- inst: pad_vddio_n
  edge: north
  order: 4
  master: sky130_ef_io__vddio_hvc_clamped_pad
- inst: pad_vssio_n
  edge: north
  order: 5
  master: sky130_ef_io__vssio_hvc_clamped_pad
- inst: pad_dout_4
  edge: north
  order: 6
  master: sky130_ef_io__gpiov2_pad_wrapped
- inst: pad_dout_5
  edge: north
  order: 7
  master: sky130_ef_io__gpiov2_pad_wrapped
- inst: pad_dout_6
  edge: north
  order: 8
  master: sky130_ef_io__gpiov2_pad_wrapped
- inst: pad_dout_7
  edge: north
  order: 9
  master: sky130_ef_io__gpiov2_pad_wrapped
- inst: pad_vddio_e
  edge: east
  order: 0
  master: sky130_ef_io__vddio_hvc_clamped_pad
- inst: pad_vssio_e
  edge: east
  order: 1
  master: sky130_ef_io__vssio_hvc_clamped_pad
- inst: pad_vssa
  edge: east
  order: 2
  master: sky130_ef_io__vssa_hvc_clamped_pad
- inst: pad_vdda
  edge: east
