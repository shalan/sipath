  master: sky130_ef_io__vdda_hvc_clamped_pad
- inst: pad_ana_in
  edge: east
  order: 4
  master: sky130_ef_io__gpiov2_pad_wrapped
- inst: pad_vref_hi
  edge: east
  order: 5
  master: sky130_ef_io__gpiov2_pad_wrapped
- inst: pad_vref_lo
  edge: east
  order: 6
  master: sky130_ef_io__gpiov2_pad_wrapped
- inst: pad_dac_out
  edge: east
  order: 7
  master: sky130_ef_io__gpiov2_pad_wrapped
- inst: pad_cfg_0
  edge: south
  order: 0
  master: sky130_ef_io__gpiov2_pad_wrapped
- inst: pad_cfg_1
  edge: south
  order: 1
  master: sky130_ef_io__gpiov2_pad_wrapped
- inst: pad_cfg_2
  edge: south
  order: 2
  master: sky130_ef_io__gpiov2_pad_wrapped
- inst: pad_vccd_s
  edge: south
