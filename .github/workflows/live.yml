# Live tests nightly (and on demand): real OpenROAD / Yosys / KLayout runs in the
# locked ORFS image on the locked open_pdks release, checked against the
# regression limits (sipath/tests/limits.yaml) except wall time, which belongs
# to the machine the limits were taken on.
name: live

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      classes:
        description: "live test classes (space-separated); empty: every group"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: chip       # mcu8: pad ring, macros, analog, full signoff (about an hour)
            classes: LiveMcuDie
          - group: openframe  # the OpenFrame harness, chip assembly with the seal ring, precheck, Magic DRC
            classes: LiveOpenFrame LiveMagic
          - group: route-search-openframe  # multiple routed branches; its own time/resource budget
            classes: LiveRouteSearchOpenFrame
          - group: blocks
            classes: >-
              LiveRtl LiveSoftMacro LiveHs LiveResume LiveMcp LiveIhp LiveIhpRing LiveScale OpenRoad
              LiveMacroPlacers LiveAdaptive LiveCancel LiveBudget LiveFork LiveDocs LiveBoundedSearch LiveHardenedParent
              LiveRouteSearchMacro
    env:
      SIPATH_LIMITS_IGNORE: max_runtime_s
      PDK_ROOT: /home/runner/pdk
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space (the PDK build is about 15 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af
          df -h /

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install SiPath and ciel
        run: python -m pip install -e . "ciel==2.6.1"

      - name: Locked open_pdks release (ciel)
        run: python -m sipath install-pdk

      - name: Locked ORFS image
        run: docker pull "$(python -c 'from sipath.toolchain import image; print(image("orfs"))')"

      # integrate, Magic DRC and precheck need the Magic and precheck images, which are built here: they are
      # not published, so the job names them by tag and allows those unpinned images (the ORFS image is still
      # the locked digest: nothing configures it otherwise; their base is that image)
      - name: Magic and precheck images (docker/magic on the locked ORFS image, docker/precheck on it)
        if: matrix.group == 'openframe' || matrix.group == 'route-search-openframe'
        run: |
          base="$(python -c 'from sipath.toolchain import image; print(image("orfs"))')"
          docker build -q --platform linux/amd64 --build-arg BASE="$base" -t sipath/orfs-magic:8.3.685 docker/magic
          docker build -q --platform linux/amd64 --build-arg BASE=sipath/orfs-magic:8.3.685 \
            -t sipath/precheck:1.3.7 docker/precheck
          echo "SIPATH_MAGIC_IMAGE=sipath/orfs-magic:8.3.685" >> "$GITHUB_ENV"
          echo "SIPATH_PRECHECK_IMAGE=sipath/precheck:1.3.7" >> "$GITHUB_ENV"
          echo "SIPATH_REQUIRE_DIGEST=0" >> "$GITHUB_ENV"

      - name: Readiness (sipath doctor)
        run: python -m sipath doctor

      - name: Macro placer Python (cdlns)
        if: matrix.group == 'blocks'
        run: python -m sipath setup-placer

      - name: Inputs and scheduler rules
        if: matrix.group == 'blocks'
        run: python -m sipath validate

      # the unit tests that need an open_pdks tree skip on the unit workflow's runners: here they run
      - name: Unit tests with the PDK
        if: matrix.group == 'blocks'
        run: python -m unittest sipath.tests.test_unit

      - name: Live tests
        env:
          SIPATH_TEST_KEEP: ${{ github.workspace }}/live-runs
          CLASSES: ${{ github.event.inputs.classes }}  # through the environment: never pasted into the script
          GROUP_CLASSES: ${{ matrix.classes }}
        run: |
          run="$GROUP_CLASSES"
          if [ -n "$CLASSES" ]; then  # the requested classes, each in its own group's job (unlisted ones: blocks)
            run=""
            for c in $CLASSES; do
              case " $GROUP_CLASSES " in *" $c "*) run="$run $c" ;; esac
              if [ "${{ matrix.group }}" = blocks ] && ! grep -qw -- "$c" .github/workflows/live.yml; then run="$run $c"; fi
            done
            [ -n "$run" ] || { echo "no requested class belongs to this group"; exit 0; }
          fi
          python -m sipath.tests.run_live -j 2 $run

      - name: Keep the logs of a run that did not pass
        if: ${{ !success() }}
        uses: actions/upload-artifact@v7
        with:
          name: live-${{ matrix.group }}-logs
          path: |
            live-runs/**/graph.json
            live-runs/**/report.md
            live-runs/**/*.log
            live-runs/**/error.txt
            live-runs/**/signoff.json
          retention-days: 14
          if-no-files-found: ignore

  # the tutorial as a reader runs it, on the native path (no Docker): its first part, through gcd8 to signoff and
  # explore mode (notebooks/smoke.py runs the notebook's own cells in an IPython shell)
  tutorial:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SIPATH_TUTORIAL_NATIVE: "1"
      PDK_ROOT: /home/runner/pdk
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: IPython (the shell the notebook's cells run in)
        run: python -m pip install ipython pandas pyyaml

      - name: Tutorial, first part
        run: python notebooks/smoke.py --until 13
