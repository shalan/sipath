# Unit tests on every push and pull request: no OpenROAD, no PDK tree, seconds.
# Tests that need an open_pdks tree skip (with the reason) on these runners.
name: unit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:  # a newer push supersedes a run still going on the same ref
  group: unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.14"]   # the oldest supported, a common one, the newest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest -v sipath.tests.test_unit
      - name: Example RTL simulations
        if: matrix.python == '3.12'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y iverilog
          python -m unittest -v sipath.tests.test_route_search.RouteSearchRtl
      - name: Reference docs are current
        run: |
          python -m sipath docs
          git diff --exit-code docs/reference.md
      - name: Wheel carries the package data
        run: |
          python -m pip wheel --no-deps -w dist .
          python -m zipfile -l dist/*.whl > wheel.txt
          for f in sipath/toolchain.json sipath/third_party/run_cdlns.py sipath/pdks/sky130A.yaml \
                   sipath/harnesses/openframe.yaml sipath/examples/gcd8.yaml sipath/tests/limits.yaml \
                   sipath/examples/openframe_gcd8_route_search.yaml sipath/examples/gcd8_macro_route_search.yaml \
                   sipath/examples/tb/gcd8_tb.v sipath/examples/tb/openframe_gcd8_tb.v \
                   sipath/examples/uart_fifo.yaml sipath/examples/openframe_uart.yaml \
                   sipath/examples/rtl/uart_fifo.v sipath/examples/rtl/openframe_uart.v \
                   sipath/examples/rtl/uart_fifo.sdc sipath/examples/rtl/openframe_uart.sdc \
                   sipath/examples/tb/uart_fifo_tb.v sipath/examples/tb/openframe_uart_tb.v; do
            grep -q "$f" wheel.txt || { echo "missing from the wheel: $f"; exit 1; }
          done
          if grep -E "__pycache__|\.pyc|examples/hardened/|examples/tut_|caravel/chip_io" wheel.txt; then
            echo "the wheel carries files that are not the package's (above)"; exit 1
          fi
