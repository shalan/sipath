# Unit tests on every push and pull request: no OpenROAD, no PDK tree, seconds.
# Tests that need an open_pdks tree skip (with the reason) on these runners.
name: unit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.14"]   # the oldest supported, a common one, the newest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest -v sipath.tests.test_unit
      - name: Reference docs are current
        run: |
          python -m sipath docs
          git diff --exit-code docs/reference.md
      - name: Wheel carries the package data
        run: |
          python -m pip wheel --no-deps -w dist .
          python -m zipfile -l dist/*.whl > wheel.txt
          for f in sipath/toolchain.json sipath/third_party/run_cdlns.py sipath/pdks/sky130A.yaml \
                   sipath/harnesses/openframe.yaml sipath/examples/gcd8.yaml; do
            grep -q "$f" wheel.txt || { echo "missing from the wheel: $f"; exit 1; }
          done
