<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="t">
  <title id="t">SiPath</title>
  <!-- die -->
  <rect x="6" y="6" width="116" height="116" rx="20" fill="#0E2A47"/>
  <!-- standard-cell rows -->
  <g stroke="#1B4470" stroke-width="2">
    <line x1="22" y1="30" x2="106" y2="30"/>
    <line x1="22" y1="46" x2="106" y2="46"/>
    <line x1="22" y1="58" x2="106" y2="58"/>
    <line x1="22" y1="70" x2="106" y2="70"/>
    <line x1="22" y1="82" x2="106" y2="82"/>
    <line x1="22" y1="98" x2="106" y2="98"/>
  </g>
  <!-- pins on the die edges -->
  <rect x="112" y="32" width="14" height="12" rx="2" fill="#F5A04A"/>
  <rect x="2" y="84" width="14" height="12" rx="2" fill="#F5A04A"/>
  <!-- the routed path: an S of orthogonal segments -->
  <path d="M 118 38 H 34 V 64 H 94 V 90 H 10" fill="none" stroke="#F28C38" stroke-width="10"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- vias at the bends -->
  <g fill="#FFE2BF" stroke="#0E2A47" stroke-width="1.5">
    <rect x="29" y="33" width="10" height="10" rx="2"/>
    <rect x="29" y="59" width="10" height="10" rx="2"/>
    <rect x="89" y="59" width="10" height="10" rx="2"/>
    <rect x="89" y="85" width="10" height="10" rx="2"/>
  </g>
</svg>
