[build-system]
requires = ["setuptools>=77"]  # license = "<SPDX>" and license-files
build-backend = "setuptools.build_meta"

[project]
name = "sipath"
version = "0.1.0"
description = "The path to silicon, steered by AI: physical-design flow infrastructure (attempt graph, step library, tool adapters, MCP) with a reference RTL-to-GDS flow, driven by YAML design files."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Mohamed Shalan" }]
dependencies = ["pyyaml>=6"]

[project.urls]
Homepage = "https://github.com/shalan/sipath"

[project.scripts]
sipath = "sipath.__main__:cli"

[tool.setuptools.packages.find]
include = ["sipath", "sipath.*"]

[tool.setuptools.package-data]
# PDK descriptions and decks, KLayout scripts, templates, harness sources, the
# example designs and their committed inputs, the toolchain lock, the vendored
# macro placer (run in the placer Python, not imported)
sipath = [
    "toolchain.json",
    "synth_recipes/*",
    "pdks/**/*",
    "klayout/*",
    "templates/**/*",
    "harnesses/**/*",
    "examples/**/*",
    "third_party/**/*",
    "tests/limits.yaml",
]

[tool.setuptools.exclude-package-data]
# what the checkout may hold but the package must not: bytecode, generated views, the tutorial's design files,
# the Caravel frame layout (fetched per harnesses/sources/SOURCES.txt), whatever the globs above would sweep in
sipath = [
    "**/__pycache__/*",
    "**/*.pyc",
    "examples/hardened/**",
    "examples/tut_*.yaml",
    "harnesses/sources/caravel/chip_io.*",
]
